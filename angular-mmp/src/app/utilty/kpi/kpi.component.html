<p-toast position="top-right" key="test" appendTo="body"></p-toast>

<p-fluid class="grid grid-cols-12 gap-8 px-4">
    <div class="col-span-12 xl:col-span-12">
        <div class="card">
            <div class="p-formgroup-inline flex flex-wrap gap-3 align-items-center">
                <div class="flex align-items-center gap-10">
                    <div class="flex align-items-center gap-4">
                        <div class="font-semibold text-2xl">品番</div>
                        <p-dropdown [(ngModel)]="partslistValue" [options]="partslistValues"
                                    optionLabel="code" placeholder="Select" 
                                    (onChange)="onPartsNoSelect()"/>
                    </div>
                    <div class="flex align-items-center gap-4">
                        <div class="font-semibold text-2xl">品名</div>
                        <p-dropdown [(ngModel)]="partslistValue" [options]="partslistValues"
                                    optionLabel="name" placeholder="Select"
                                    (onChange)="onPartsNameSelect()"/>
                    </div>

                    <div class="flex align-items-center gap-4">
                        <div class="font-semibold text-2xl">設備</div>
                        <p-dropdown [(ngModel)]="machinelistValue" [options]="machinelistValues" optionLabel="name" placeholder="Select"/>
                    </div>
                    <div class="font-semibold text-2xl">計画更新:{{updated_plan | date:'yyyy/MM/dd'}}</div>
 
                    <div class="font-semibold text-2xl">最新生産:{{updated_prod | date:'yyyy/MM/dd'}}</div>
                
                    <p-button label="更新" (onClick)="displayCharts()"></p-button>
                    
                </div>
           </div>
        </div>
    </div>
    <!-- グラフエリア -->
    <div class="col-span-12 xl:col-span-12">
        <div class="card flex flex-col gap-6 w-full" style="min-height: 0; overflow: auto;">
            <!-- 行全体の高さをここで設定 -->
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex flex-wrap gap-2 w-full" style="min-height: 0;">
                    <div class="kpi-chart" style="min-width: 0; width: 100%;">
                        <!-- 下揃えにし、横並びに設定 -->
                        <div class="flex items-end justify-between mb-2">
                            <!-- 左側：生産実績 -->
                            <div class="font-semibold text-2xl">
                                生産実績 [個]
                            </div>
                            <!-- 右側：生産進捗 / 計画比（右寄せ & 下揃え） -->
                            <div class="flex gap-4 items-end">
                                <!-- 生産進捗 -->
                                <!-- 判定（〇=青 / ✖=赤 差分（判定と同じ色） -->
                                <div class="font-semibold text-4xl judge text-right"
                                    [class.ok]="judge === '〇'"
                                    [class.ng]="judge === '✖'">
                                    生産進捗：{{ judge || '-' }}
                                </div>
                                <!-- 計画比 -->
                                <div class="font-semibold text-4xl delta text-right"
                                    [class.ok]="judge === '〇'"
                                    [class.ng]="judge === '✖'">
                                    計画比：{{ delta || '-' }}
                                </div>
                            </div>
                        </div>
                        <p-chart type="bar" [data]="ProdChartData" [options]="ProdChartOptions" [height]="chartHeight+'px'" [style.height.px]="chartHeight"></p-chart>
                        
                        <div class="font-semibold text-2xl mb-2">稼働率 [%]</div>
                        <p-chart type="bar" [data]="OperatingRateData" [options]="OperatingRateOptions" [height]="chartHeight+'px'" [style.height.px]="chartHeight"></p-chart>
                        
                        <div class="font-semibold text-2xl mb-2">不良率 [%]</div>
                        <p-chart type="bar" [data]="DefectRateData" [options]="DefectRateOptions" [height]="chartHeight+'px'" [style.height.px]="chartHeight"></p-chart>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- ここまで -->
</p-fluid>
